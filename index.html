<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار إلكتروني</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        font-weight: 900;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      .hidden {
        display: none !important;
      }

      #login-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 30px;
        background-color: #ffffff;
        border: 2px solid #007bff;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 123, 255, 0.2);
        text-align: center;
        transition: all 0.3s ease-in-out;
      }

      #login-container label {
        display: block;
        font-size: 18px;
        color: #333;
        margin-bottom: 8px;
        text-align: right;
      }

      #login-container input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }

      #login-container button {
        width: 100%;
        background-color: #007bff;
        color: white;
        padding: 12px 0;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      #login-container button:hover {
        background-color: #0056b3;
      }

      #result {
        margin-top: 20px;
        text-align: right;
      }

      #timer {
        font-size: 20px;
        color: red;
        font-weight: bold;
      }

      h2 {
        font-size: 22px;
        font-weight: 900;
        color: #000000;
      }

      label {
        font-size: 18px;
        font-weight: 900;
        color: #333333;
      }

      #next-button {
        position: absolute;
        left: 20px;
        bottom: 20px;
        padding: 10px 20px;
        font-weight: 900;
      }

      .correct-answer {
        color: green;
        font-weight: 900;
      }

      .wrong-answer {
        color: red;
        font-weight: 900;
      }

      ul {
        list-style-type: none;
        padding: 0;
      }

      ul li {
        margin-bottom: 15px;
        background-color: #f0f4f8;
        padding: 10px;
        border-radius: 6px;
        font-weight: 900;
        color: #000;
        font-size: 18px;
      }

      #result h2,
      #result h3,
      #result p {
        font-weight: 900;
        color: #000;
        font-size: 18px;
        text-align: right;
      }

      #retry-button {
        padding: 10px 20px;
        font-weight: bold;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 20px;
      }

      label[lang="en"] {
        direction: ltr;
        text-align: left;
        display: block;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h2>التدريب علي اختبارات الجهاز المركزى</h2>

    <div id="login-container">
      <label for="password">🔒 أدخل كلمة المرور:</label>
      <input id="password" type="password" placeholder="مثال: 12345678" />
      <label for="duration">⏳ حدد مدة الاختبار (بالدقائق):</label>
      <input id="duration" type="number" value="5" min="1" />
      <button onclick="checkPassword()">🚀 دخول</button>
    </div>

    <div class="hidden" id="quiz">
      <div id="timer">5:00</div>
      <div id="question-info">السؤال 1 من 20</div>
      <form id="quizForm">
        <div id="question-container"></div>
        <button id="next-button" onclick="nextQuestion(event)" type="button">
          التالي
        </button>
      </form>
    </div>

    <div class="hidden" id="result"></div>

    <script>
      const questions = [
        {
          question: 'What is the opposite of "Big"?',
          options: ["Small", "Rich", "Fast", "Late"],
          answer: "Small",
          explanation: "ترجمة: ما عكس كلمة Big؟ Big = كبير، Small = صغير.",
        },
        {
          question: "What is the fastest animal?",
          options: ["Lion", "Horse", "Cheetah", "Elephant"],
          answer: "Cheetah",
          explanation: "ترجمة: ما أسرع حيوان؟ Cheetah = الفهد.",
        },
        {
          question: "That morning, she ...... to school.",
          options: ["go", "goes", "went", "going"],
          answer: "went",
          explanation:
            "ترجمة: في ذلك الصباح، ذهبت إلى المدرسة. That morning تدل على الماضي، لذلك نستخدم went.",
        },
        {
          question: 'What is the plural of "child"?',
          options: ["Childs", "Childes", "Children", "Childrens"],
          answer: "Children",
          explanation:
            "ترجمة: ما جمع كلمة child؟ Child = طفل، Children = أطفال.",
        },
        {
          question: 'What is the past participle of "take"?',
          options: ["Took", "Taken", "Takes", "Taking"],
          answer: "Taken",
          explanation:
            "ترجمة: ما التصريف الثالث للفعل take؟ Take = يأخذ، Took = التصريف الثاني، Taken = التصريف الثالث.",
        },
        {
          question: 'What is the opposite of "Up"?',
          options: ["Tall", "Down", "Small", "Early"],
          answer: "Down",
          explanation: "ترجمة: ما عكس كلمة Up؟ Up = أعلى، Down = أسفل.",
        },
        {
          question: "What is the large animal that is gray in color?",
          options: ["Tiger", "Dog", "Elephant", "Giraffe"],
          answer: "Elephant",
          explanation:
            "ترجمة: ما الحيوان الكبير الذي يكون لونه رماديًا؟ Elephant = فيل.",
        },
        {
          question: "Next week, she ...... her grandmother.",
          options: ["visits", "visited", "will visit", "visiting"],
          answer: "will visit",
          explanation:
            "ترجمة: الأسبوع القادم، سوف تزور جدتها. Next week تدل على المستقبل، لذلك نستخدم will visit.",
        },

        {
          question: 'What is the plural of "ox"?',
          options: ["Oxes", "Oxs", "Oxen", "Oxies"],
          answer: "Oxen",
          explanation: "ترجمة: ما جمع كلمة ox؟ Ox = ثور، Oxen = ثيران.",
        },
        {
          question: 'What is the opposite of "Poor"?',
          options: ["Fast", "Short", "Rich", "Late"],
          answer: "Rich",
          explanation: "ترجمة: ما عكس كلمة Poor؟ Poor = فقير، Rich = غني.",
        },
        {
          question: 'What is the opposite of "Tall"?',
          options: ["Early", "Big", "Short", "Poor"],
          answer: "Short",
          explanation: "ترجمة: ما عكس كلمة Tall؟ Tall = طويل، Short = قصير.",
        },
        {
          question: 'What is the plural of "fox"?',
          options: ["Foxs", "Foxes", "Foxies", "Foxen"],
          answer: "Foxes",
          explanation: "ترجمة: ما جمع كلمة fox؟ Fox = ثعلب، Foxes = ثعالب.",
        },

        {
          question:
            "Which animal lives in African forests and has a long neck?",
          options: ["Lion", "Giraffe", "Zebra", "Elephant"],
          answer: "Giraffe",
          explanation:
            "ترجمة: أي حيوان يعيش في الغابات الأفريقية وله رقبة طويلة؟ Giraffe = زرافة.",
        },
        {
          question: 'What is the opposite of "Late"?',
          options: ["Poor", "Big", "Early", "Slow"],
          answer: "Early",
          explanation: "ترجمة: ما عكس كلمة Late؟ Late = متأخر، Early = مبكر.",
        },
        {
          question: 'What is the opposite of the word "Rough"?',
          options: ["Smooth", "Hard", "Heavy", "Thick"],
          answer: "Smooth",
          explanation: "ترجمة: ما عكس كلمة Rough؟ Rough = خشن، Smooth = ناعم.",
        },
        {
          question: "The ____ is brown and climbs trees.",
          options: ["Monkey", "Lion", "Tiger", "Bear"],
          answer: "Monkey",
          explanation: "ترجمة: الـ ____ لونه بني ويتسلق الأشجار. Monkey = قرد.",
        },
        {
          question: 'What is the past participle of "went"?',
          options: ["Go", "Gone", "Went", "Going"],
          answer: "Gone",
          explanation:
            "ترجمة: ما التصريف الثالث للفعل go؟ Go = يذهب، Went = التصريف الثاني، Gone = التصريف الثالث.",
        },
        {
          question: 'What is the past participle of "go"?',
          options: ["Goes", "Going", "Went", "Gone"],
          answer: "Gone",
          explanation:
            "ترجمة: ما التصريف الثالث للفعل go؟ Gone = التصريف الثالث للفعل go.",
        },
        {
          question: "What is the past simple of the verb 'go'?",
          options: ["Goes", "Went", "Go", "Going"],
          answer: "Went",
          explanation:
            "ترجمة: ما الماضي البسيط للفعل go؟ Go = يذهب، Went = ذهب.",
        },
        {
          question: "Choose the reflexive pronoun.",
          options: ["my", "you", "his", "themselves"],
          answer: "themselves",
          explanation: "ترجمة: اختر ضمير الانعكاس. Themselves = أنفسهم.",
        },
        {
          question: "Which of the following is green and often used in salads?",
          options: ["Lettuce", "Carrot", "Potato", "Tomato"],
          answer: "Lettuce",
          explanation:
            "ترجمة: أي مما يلي لونه أخضر ويُستخدم غالبًا في السلطات؟ Lettuce = خس.",
        },
        {
          question: 'What is the opposite of the word "Sad"?',
          options: ["Angry", "Tired", "Happy", "Afraid"],
          answer: "Happy",
          explanation: "ترجمة: ما عكس كلمة Sad؟ Sad = حزين، Happy = سعيد.",
        },
        {
          question: "The opposite of the word 'light' is ____",
          options: ["Lamp", "Darkness", "Brightness", "Clear"],
          answer: "Darkness",
          explanation:
            "ترجمة: عكس كلمة Light هو ____. Light = ضوء، Darkness = ظلام.",
        },
        {
          question: "What is the opposite of fat?",
          options: ["Big", "Thin", "Short", "Small"],
          answer: "Thin",
          explanation: "ترجمة: ما عكس كلمة Fat؟ Fat = سمين، Thin = نحيف.",
        },
        {
          question: "What is the superlative form of 'beautiful'?",
          options: [
            "Very beautiful",
            "More beautiful",
            "The most beautiful",
            "Beautifuller",
          ],
          answer: "The most beautiful",
          explanation:
            "ترجمة: ما صيغة التفضيل العليا لكلمة Beautiful؟ The most beautiful = الأجمل.",
        },
        {
          question: "Which of the following is a preposition?",
          options: ["Because", "Until", "Although", "And"],
          answer: "Until",
          explanation: "ترجمة: أي من الاختيارات التالية حرف جر؟ Until = حتى.",
        },
        {
          question:
            "Which animal can we see at the zoo, It has black and white stripes.",
          options: ["Elephant", "Lion", "Giraffe", "Zebra"],
          answer: "Zebra",
          explanation:
            "ترجمة: أي حيوان يمكننا رؤيته في حديقة الحيوان وله خطوط باللونين الأسود والأبيض؟ Zebra = حمار وحشي.",
        },
        {
          question: "What do we use to write on a chalkboard?",
          options: ["Marker", "Chalk", "Pencil", "Eraser"],
          answer: "Chalk",
          explanation:
            "ترجمة: ماذا نستخدم للكتابة على السبورة؟ Chalk = طباشير.",
        },
      ];

      let currentQuestion = 0;
      let score = 0;
      let timer;
      let timeLeft;
      let userAnswers = [];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function shuffleQuestions() {
        shuffle(questions);
        questions.forEach((q) => shuffle(q.options));
      }

      function checkPassword() {
        const passwordInput = document.getElementById("password").value;
        const durationInput =
          parseInt(document.getElementById("duration").value) || 10;
        timeLeft = durationInput * 60;

        if (passwordInput === "034") {
          shuffleQuestions();
          document.getElementById("login-container").classList.add("hidden");
          document.getElementById("quiz").classList.remove("hidden");
          document.getElementById("result").classList.add("hidden");
          currentQuestion = 0;
          score = 0;
          userAnswers = [];
          loadQuestion();
          startTimer();
        } else {
          alert("🚫 المحاولة غير صحيحة! تأكد من كتابة كلمة السر بشكل دقيق.");
        }
      }

      function loadQuestion() {
        const questionContainer = document.getElementById("question-container");
        questionContainer.innerHTML = `
    <h2 lang="en" dir="ltr">${questions[currentQuestion].question}</h2>
    ${questions[currentQuestion].options
      .map(
        (option) => `
      <label lang="en" dir="ltr">
        <input type="radio" name="option" value="${option}" />
        ${option}
      </label><br>
    `,
      )
      .join("")}
  `;
        document.getElementById("question-info").textContent = `السؤال ${
          currentQuestion + 1
        } من ${questions.length}`;
      }

      function nextQuestion(event) {
        event.preventDefault();
        const selected = document.querySelector('input[name="option"]:checked');
        if (!selected) return alert("اختر إجابة.");
        userAnswers[currentQuestion] = selected.value;
        if (selected.value === questions[currentQuestion].answer) score++;
        currentQuestion++;
        if (currentQuestion < questions.length) {
          loadQuestion();
        } else {
          clearInterval(timer);
          showResults();
        }
      }

      function showResults(timeUp = false) {
        document.getElementById("quiz").classList.add("hidden");
        const resultDiv = document.getElementById("result");
        resultDiv.classList.remove("hidden");

        const percent = ((score / questions.length) * 100).toFixed(1);

        let feedback = "";
        if (percent == 100) {
          feedback = "أنت بطل! برافو عليك 👏";
        } else if (percent >= 80) {
          feedback = "ممتاز! واضح إنك مذاكر كويس 💪";
        } else if (percent >= 60) {
          feedback = "كويس، بس محتاج تراجع شوية 🙂";
        } else if (percent >= 40) {
          feedback = "راجع الدروس تاني وحاول تركز أكتر 📚";
        } else {
          feedback = "ابدأ من الأول وراجع كويس، شد حيلك! 💡";
        }

        let warningMsg = "";
        if (timeUp && currentQuestion < questions.length) {
          warningMsg = `
        <p style="color: red;">⏰ انتهى الوقت قبل إكمال جميع الأسئلة.</p>
        <p>في المرة الجاية حاول تحل الأسئلة بشكل أسرع علشان تلحق تكمل 💡</p>
      `;
        }

        let review = "<h3>مراجعة الإجابات:</h3><ul>";
        questions.forEach((q, i) => {
          const ua = userAnswers[i] || "لم يُجب";
          const correct = q.answer;
          const isCorrect = ua === correct;
          review += `
        <li>
          <strong>السؤال ${i + 1}:</strong> ${q.question}<br>
          إجابتك: <span class="${
            isCorrect ? "correct-answer" : "wrong-answer"
          }">${ua}</span><br>
          الإجابة الصحيحة: <span class="correct-answer">${correct}</span><br>
          <strong>التفسير:</strong> ${q.explanation || "لا يوجد تفسير."}
        </li>
      `;
        });
        review += "</ul>";

        resultDiv.innerHTML = `
      ${warningMsg}
      <h2>نتيجة الاختبار</h2>
      <p>${score} من ${questions.length} | النسبة: ${percent}%</p>
      <p>${feedback}</p>
      ${review}
      <button id="retry-button" onclick="location.reload()">إعادة المحاولة</button>
    `;
      }

      function startTimer() {
        timer = setInterval(() => {
          timeLeft--;
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          document.getElementById("timer").textContent = `${minutes}:${
            seconds < 10 ? "0" : ""
          }${seconds}`;
          if (timeLeft <= 0) {
            clearInterval(timer);
            alert("انتهى الوقت!");
            showResults(true);
          }
        }, 1000);
      }

      document
        .getElementById("quizForm")
        .addEventListener("keypress", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            nextQuestion(event);
          }
        });
    </script>
  </body>
</html>
